name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      # ⚠ NO cambiar por `tsc --noEmit` a secas: `app/tsconfig.json` es un
      # archivo de referencias con `"files": []`, así que ese comando no mira un
      # solo archivo del proyecto y sale 0 SIEMPRE. Estuvo así hasta el 16/9:
      # el CI decía «Typecheck ✓» sin haber compilado nada. `tsc -b` es el que
      # recorre las referencias de verdad.
      - name: Typecheck
        working-directory: ./app
        run: npm run typecheck

      - name: Lint
        working-directory: ./app
        run: npm run lint

      - name: Tests
        working-directory: ./app
        run: npm run test -- --run

# El deploy ahora lo hace Vercel automáticamente en cada push a main
# (integración Git de Vercel, root directory: app).
